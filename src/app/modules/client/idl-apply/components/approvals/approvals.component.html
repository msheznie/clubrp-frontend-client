<div
  class="mb-6 w-full p-4 bg-[var(--color-secondary)] border border-[var(--color-border)] rounded-lg shadow-sm sm:p-8">
  <!-- Header -->
  <div class="flex items-start space-x-4">
    <img src="../../../assets/img/icon-1.gif" alt="Review Icon" class="w-20 h-20">
    <div>
      <h2 class="text-xl font-semibold text-[var(--color-text-primary)]">Wait, We Are Reviewing Your Documents. Stay Tuned With Us…</h2>
      <p class="text-sm text-[var(--color-text-secondary)]">If all your documents are in order, you can proceed with the payment process</p>
    </div>
  </div>
  <!-- Basic Information -->
  <div class="my-5">
    <app-basic-information [formGroup]="formGroup"></app-basic-information>
  </div>
</div>
