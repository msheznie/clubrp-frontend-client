<div class="mb-6 w-full p-4 bg-white border border-gray-200 rounded-lg shadow-sm sm:p-8 dark:bg-gray-800 dark:border-gray-700">
    <!-- Header -->
    <div class="flex items-start space-x-4">
      <img src="../../../assets/img/icon-1.gif" alt="Review Icon" class="w-20 h-20">
      <div>
        <h2 class="text-xl font-semibold text-gray-800">Wait, We Are Reviewing Your Documents. Stay Tuned With Us…</h2>
        <p class="text-sm text-gray-500">If all your documents are in order, you can proceed with the payment process</p>
      </div>
    </div>
  
    <!-- Document Items -->
    <div class="space-y-3">
      <div *ngFor="let doc of documents" class="flex items-center justify-between bg-gray-50 p-3 rounded-md shadow-sm">
        <div class="flex items-center space-x-3">
          <img [src]="doc.icon" alt="icon" class="w-8 h-8">
          <span class="text-gray-800">{{ doc.label }}</span>
        </div>
        <div class="flex items-center space-x-2">
          <button *ngIf="doc.status === 'Rejected'" mat-stroked-button color="primary" class="text-xs">Submit Again</button>
          <span [ngClass]="statusClass(doc.status)" class="px-3 py-1 rounded-full text-xs font-medium">
            {{ doc.status }}
          </span>
        </div>
      </div>
    </div>
  </div>
