<app-navbar></app-navbar>
<div class="flex justify-between items-center mt-6 mx-4 md:mx-14">
  <app-breadcrumb [breadcrumbs]="breadcrumbs"></app-breadcrumb>
  <div class="flex gap-4">
      <button class="button-outline">
          <mat-icon>cancel</mat-icon>
          <span class="button-text">Cancel</span>
          </button>
      <button class="button-outline">
          <mat-icon>save</mat-icon>
          <span class="button-text">Save as Draft</span>
          </button>
      <button class="button-fill">
          <mat-icon>done</mat-icon>
          <span class="button-text">Submit</span>
          </button>
      <button class="button-fill" (click)="paySubmit()">
          <mat-icon>attach_money</mat-icon>
          <span class="button-text">Pay and Submit</span>
          </button>
  </div>
</div>
<div class="container mx-auto px-4 md:px-20 mt-4">
  <mat-stepper
    class="example-stepper" labelPosition="bottom" #steppe>
    <mat-step [stepControl]="firstFormGroup" label="Terms and Conditions">
        <form [formGroup]="firstFormGroup">
            <div class="container mx-auto">
                <app-terms-and-conditions></app-terms-and-conditions>
              </div>
              <div class="flex justify-end gap-4">
                <button class="button-fill-secondary">
                  <mat-icon>cancel</mat-icon>
                  <span class="button-text">Cancel</span>
                </button>
                <button class="button-fill" matStepperNext>
                  <span class="button-text">Apply</span>
                  <mat-icon>arrow_forward</mat-icon>
                </button>
              </div>
        </form>
    </mat-step>
    <mat-step [stepControl]="secondFormGroup" label="Basic Information">
      <form [formGroup]="secondFormGroup">
        <app-basic-information></app-basic-information>
        <app-particular-of-vehicle></app-particular-of-vehicle>
        <app-owner-address-sultanate-of-oman></app-owner-address-sultanate-of-oman>
        <app-owner-address-home-country></app-owner-address-home-country>
        <app-reference-sultanate-oman></app-reference-sultanate-oman>
        <app-references-your-home-country></app-references-your-home-country>
        <app-attachments></app-attachments>
        <div class="flex justify-end gap-4">
          <button class="button-fill-secondary" matStepperPrevious>
            <mat-icon>arrow_back</mat-icon>
            <span class="button-text">Back</span>
          </button>
          <button class="button-fill" matStepperNext>
            <span class="button-text">Next</span>
            <mat-icon>arrow_forward</mat-icon>
          </button>
        </div>
      </form>
    </mat-step>
    <mat-step [stepControl]="threeFormGroup" label="Terms & Conditions">
      <form [formGroup]="threeFormGroup">
        <app-terms-and-condition></app-terms-and-condition>
        <div class="flex justify-end gap-4">
          <button class="button-fill-secondary" matStepperPrevious>
            <mat-icon>arrow_back</mat-icon>
            <span class="button-text">Back</span>
          </button>
          <button class="button-fill" matStepperNext>
            <mat-icon>done</mat-icon>
            <span class="button-text">Submit</span>
          </button>
        </div>
      </form>
    </mat-step>
    <mat-step [stepControl]="foreFormGroup" label="Waiting for Approvals">
      <form [formGroup]="foreFormGroup">
        <app-approvals></app-approvals>
        <div class="flex justify-end gap-4">
          <button class="button-fill-secondary" matStepperPrevious>
            <mat-icon>arrow_back</mat-icon>
            <span class="button-text">Back</span>
          </button>
          <button class="button-fill" matStepperNext>
            <span class="button-text">Next</span>
            <mat-icon>arrow_forward</mat-icon>
          </button>
        </div>
      </form>
    </mat-step>
    <mat-step [stepControl]="fiveFormGroup" label="Fee and Chargers">
      <form [formGroup]="fiveFormGroup">
       <app-fee-and-chargers></app-fee-and-chargers>
      <div class="flex justify-end gap-4">
          <button class="button-fill-secondary" matStepperPrevious>
            <mat-icon>arrow_back</mat-icon>
            <span class="button-text">Back</span>
          </button>
        <button class="button-fill" (click)="paySubmit()">
          <mat-icon>attach_money</mat-icon>
          <span class="button-text">Pay</span>
        </button>
      
      </div>
</form>
    </mat-step>
    <!-- <mat-step>
      <ng-template matStepLabel>Done</ng-template>
      <p>You are now done.</p>
      <div>
        <button mat-button matStepperPrevious>Back</button>
      </div>
    </mat-step> -->
  </mat-stepper>
</div>
