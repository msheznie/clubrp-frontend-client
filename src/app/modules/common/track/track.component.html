<app-navbar></app-navbar>
<div class="flex justify-between items-center mt-6 mx-4 md:mx-14">
    <app-breadcrumb [breadcrumbs]="breadcrumbs"></app-breadcrumb>
    <div>
        <button class="button-outline" (click)="navigateToHome()">
            <mat-icon>cancel</mat-icon>
            <span class="button-text">Cancel</span>
            </button>
    </div>
</div>

<div class="mx-4 md:mx-14 mt-4 overflow-scroll">
   <div *ngIf="isLoading" class="text-center text-[var(--color-text-secondary)] py-8">
     Loading applications...
   </div>
   
   <div *ngIf="!isLoading && errorMessage" class="text-center text-red-500 py-8">
     Failed to load applications.
   </div>

  <div *ngIf="!isLoading && !errorMessage" class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort matSortActive="created_at" matSortDirection="desc" matSortDisableClear class="w-full">

      <ng-container matColumnDef="request_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Application ID</th>
        <td mat-cell *matCellDef="let row">{{ row.code }}</td>
      </ng-container>

      <ng-container matColumnDef="applicant_name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Applicant Name</th>
        <td mat-cell *matCellDef="let row">{{ getApplicantName(row) }}</td>
      </ng-container>

      <ng-container matColumnDef="licence_type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Licence Type</th>
        <td mat-cell *matCellDef="let row">{{ getLicenseType(row) }}</td>
      </ng-container>

      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created Date & Time</th>
        <td mat-cell *matCellDef="let row">{{ formatDate(row.created_at) }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let row">
          <span class="inline-flex items-center font-bold text-xs px-2.5 py-0.5 rounded-full tracking-wide uppercase"
                [ngClass]="getStatusColor(getStatusText(row.overall_status))">
            {{ getStatusText(row.overall_status) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col">Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-col">
          <div class="flex justify-start items-center gap-2 table-actions-inner">
            <!-- View button - always visible -->
            <button 
              mat-icon-button 
              class="action-button view-button" 
              [routerLink]="['/track-view', row.id]"
              title="View Details">
              <mat-icon>visibility</mat-icon>
            </button>
            
            <!-- Edit button - show for IDL drafts (application_type null and status Draft) -->
            <button
              mat-icon-button
              *ngIf="row.application_type == null && row.overall_status === 0"
              class="action-button edit-button"
              title="Edit Draft"
              (click)="editDraft(row)">
              <mat-icon>edit</mat-icon>
            </button>

            <!-- Print button - show for specific statuses -->
            <button 
              mat-icon-button 
              *ngIf="row.overall_status === 3 || row.overall_status === 6 || row.overall_status === 8"
              class="action-button print-button"
              title="Print">
              <mat-icon>local_printshop</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No data</td>
      </tr>
    </table>

    <mat-paginator
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [length]="totalItems"
      [showFirstLastButtons]="true"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
  
</div>
