<header class="sticky top-2 z-50 bg-[var(--color-secondary)] px-4 py-3 md:px-[20px] md:py-[10px] rounded-2xl overflow-visible backdrop-blur mx-2 shadow-lg">
  <!-- Desktop Navbar -->
  <div class="hidden md:flex justify-between items-center">
    <!-- Logo -->
    <div class="logo">
      <img src="../../../assets/img/logo.png" class="w-[100px]" alt="Logo" />
    </div>

    <!-- Nav + Button -->
    <div class="flex items-center">
      <nav class="mr-9">
        <ul class="flex gap-6 text-sm text-[var(--color-text-secondary)]">
          <li><a href="#">Home</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </nav>

      <div *ngIf="isAuthenticated" class="relative">
        <button 
          type="button" 
          class="user-menu flex items-center py-1.5 px-3 rounded-full text-sm hover:bg-white/10 transition-colors"
          (click)="toggleUserMenu()"
        >
          <span class="btn-image w-[24px]">
            <img src="../../../assets/img/btn-image.png" alt="Icon" />
          </span>
          <span class="text-[var(--color-text-primary)] ml-2">Hi {{ userName }}</span>
        </button>

        <!-- User Dropdown Menu -->
        <div 
          *ngIf="isUserMenuOpen" 
          class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50 border border-gray-200"
        >
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
            Settings
          </a>
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
            Track My Application
          </a>
          <button 
            (click)="logout()" 
            class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
          >
            Logout
          </button>
        </div>
      </div>

      <button 
        *ngIf="!isAuthenticated"
        type="button" 
        class="sign-in flex items-center py-1.5 px-3 rounded-full text-sm" 
        (click)="openSignin()"
      >
        <span class="btn-image w-[24px]">
          <img src="../../../assets/img/btn-image.png" alt="Icon" />
        </span>
        <span class="btn-text ml-2">Sign In</span>
      </button>
    </div>
  </div>


  <!-- Mobile Navbar -->
  <div class="flex justify-between items-center md:hidden">
    <!-- Hamburger -->
    <button type="button" aria-label="Open menu" title="Open menu" (click)="toggleMobileMenu()" class="text-[var(--color-text-secondary)]">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Logo -->
    <img src="../../../assets/img/logo.png" class="w-[90px]" alt="Logo" />
  </div>

  <!-- Mobile Drawer -->
  <div *ngIf="isMobileMenuOpen" [ngClass]="{ 'slide-down': isMobileMenuOpen, 'slide-up': !isMobileMenuOpen }" class="absolute top-full left-0 w-full bg-[var(--color-secondary)] shadow-lg mt-2 rounded-xl p-4 z-50">
    <nav class="flex flex-col gap-4 text-[var(--color-text-secondary)] text-sm">
      <a href="#" class="hover:text-[var(--color-text-primary)]">Home</a>
      <a href="#" class="hover:text-[var(--color-text-primary)]">About Us</a>
      <a href="#" class="hover:text-[var(--color-text-primary)]">Contact Us</a>
    </nav>

    <!-- Divider -->
    <div class="border-t my-4"></div>

    <div *ngIf="isAuthenticated" class="space-y-2">
      <div class="flex items-center mb-4">
        <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center mr-3">
          <img src="../../../assets/img/profile-img.png" alt="Profile" class="w-8 h-8 rounded-full" />
        </div>
        <span class="text-[var(--color-text-primary)]">Hi {{ userName }}</span>
      </div>
      
      <a href="#" class="block py-2 text-[var(--color-text-secondary)] hover:text-[var(--color-text-primary)]">
        Settings
      </a>
      <a href="#" class="block py-2 text-[var(--color-text-secondary)] hover:text-[var(--color-text-primary)]">
        Track My Application
      </a>
      <button 
        (click)="logout()" 
        class="block w-full text-left py-2 text-red-600 hover:text-red-700"
      >
        Logout
      </button>
    </div>

  <!-- Mobile Sign In Button -->
   <div *ngIf="!isAuthenticated" class="flex justify-center items-center">
  <button
    type="button"
    class="flex items-center justify-center gap-2 bg-[var(--color-button-fill-secondary)] text-[var(--color-text-primary)] py-2 px-4 rounded-full text-sm"
    (click)="openSignin()"
  >
    <img src="../../../assets/img/btn-image.png" alt="Icon" class="w-[20px] h-[20px]" />
    <span>Sign In</span>
  </button>
   </div>
  </div>
</header>
