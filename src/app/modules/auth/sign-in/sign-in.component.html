<div class="p-8">
    <div class="flex justify-center items-center gap-2 md:mt-4">
        <img src="/assets/img/oaa-logo.png" class="" alt="oaa-logo" />
        <img src="/assets/img/fia-logo.png" class="" alt="oaa-logo" />
    </div>
    <div class="flex justify-center items-center mt-4">
        <span class="text-[32px] text-[var(--color-text-primary)]">Login to <span class="text-[32px] text-[var(--color-text-error)]"> OAA</span></span>
    </div>
    <form id="loginForm" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="flex flex-col justify-center items-center mt-8 gap-8">
            <mat-form-field appearance="outline" class="mat-form-field w-full">
                <mat-label>User name</mat-label>
                <input id="email" matInput formControlName="username"/>
                <mat-error *ngIf="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched">
                    Username is required
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="mat-form-field w-full">
                <mat-label>Password</mat-label>
                <input id="password" matInput type="password" formControlName="password"/>
                <mat-error *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
                    Password is required
                </mat-error>
            </mat-form-field>
        </div>
        <div class="flex justify-between mt-4">
            <span class="text-[var(--color-text-secondary)] text-[14px]">Don't have an account? <button type='button' (click)="openSignup()" class="font-bold">Sign Up</button></span>
            <span class="text-[var(--color-text-secondary)]">Forgot Password</span>
        </div>

        <div class="flex items-center justify-center mt-10 w-full">
            <button type="submit" class="button-fill justify-center w-[50%] h-10" [disabled]="loginForm.invalid || submitted">
                Login
            </button>
        </div>
    </form>

    <div class="flex items-center justify-center mt-4">
       <span class="text-[var(--color-text-secondary)] text-[14px]">or Login with</span>
    </div>
    <div class="flex items-center justify-center mt-4">
        <button class="button-google justify-center w-[85%] md:w-[50%] h-10" (click)="loginWithGoogle()">
            <img src="/assets/icons/gmail-icon.png" alt="icon" class="w-4 h-4">
            Continue With Google
        </button>
    </div>
</div>
